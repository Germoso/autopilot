# Extensiones de pi que instala el kit AUTOPILOT.
# ------------------------------------------------------------------
# Una por linea, en el formato exacto que se le pasa a `pi install`
# (p. ej. npm:algo). Editalo libremente: la proxima instalacion
# (./install.sh) la aplica via `pi install --local --approve`, y el
# --uninstall --local la retira con `pi remove --local --approve`.
#   - '#' al inicio de linea (o despues de la spec) es comentario.
#   - El nombre corto de deteccion (clave) se deriva solo: lo que
#     sigue a "npm:".
npm:@juicesharp/rpiv-ask-user-question
npm:pi-background-tasks
npm:pi-thinking-steps
